name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag (vX.Y.Z)
        required: true
      registry:
        type: choice
        options: [testpypi, pypi]
        default: testpypi
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e '.[dev]'
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python -c 'import os, video2context; assert os.environ["RELEASE_TAG"] == "v" + video2context.__version__'
      - run: ruff check . && ruff format --check . && pytest -q
      - run: python -m build
      - run: pipx install dist/*.whl && pipx runpip video2context check
      - run: ~/.local/bin/v2c --help && ~/.local/bin/v2c --version
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.registry }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - if: inputs.registry == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - if: inputs.registry == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
