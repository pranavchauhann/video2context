[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "video2context"
version = "0.1.0"
description = "Turn screen recordings into compact, timestamped context for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Pranav Chauhan" }]
keywords = [
  "screen-recording",
  "video",
  "coding-agent",
  "claude-code",
  "cursor",
  "codex",
  "ocr",
  "whisper",
  "developer-tools",
  "cli",
]
dependencies = ["click>=8.1,<9", "numpy>=1.24,<3", "httpx>=0.27,<1"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/pranavchauhann/video2context"
Documentation = "https://github.com/pranavchauhann/video2context#readme"
Issues = "https://github.com/pranavchauhann/video2context/issues"
Changelog = "https://github.com/pranavchauhann/video2context/blob/main/CHANGELOG.md"

[project.optional-dependencies]
local-stt = ["faster-whisper>=1.0,<2"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2", "jsonschema>=4", "pipx>=1.7"]

[project.scripts]
v2c = "video2context.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/video2context"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
